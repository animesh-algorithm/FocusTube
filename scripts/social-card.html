<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FocusTube social card artwork</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,900;6..12,1000&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        background: #4541ef;
        color: #fffde9;
        font-family: "DM Sans", sans-serif;
        overflow: hidden;
      }
      .card {
        height: 630px;
        position: relative;
        padding: 50px 64px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 13px;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -1px;
      }
      .brand img {
        width: 42px;
        height: 42px;
      }
      h1 {
        font-family: "Nunito Sans", sans-serif;
        font-weight: 900;
        font-size: 91px;
        line-height: 1.01;
        letter-spacing: -5px;
        margin: 43px 0 0;
        position: relative;
        z-index: 1;
      }
      .underline {
        position: absolute;
        left: 57px;
        top: 323px;
        width: 724px;
        height: 22px;
      }
      .bottom {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 133px;
        background: #fffde9;
        color: #292858;
        padding: 43px 64px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .bottom:before {
        content: "";
        position: absolute;
        top: -8px;
        left: 0;
        width: 100%;
        height: 9px;
        background: radial-gradient(
            10px 9px at 10px 9px,
            #fffde9 98%,
            transparent 101%
          )
          0 0/20px 9px repeat-x;
      }
      .detail {
        display: flex;
        align-items: center;
        gap: 13px;
        font-size: 24px;
        font-weight: 600;
      }
      .detail img {
        width: 30px;
        height: 30px;
      }
      .by {
        font-size: 20px;
        color: #68677b;
      }
      .free {
        position: absolute;
        right: 70px;
        top: 66px;
        background: #f9f493;
        color: #292858;
        border-radius: 100px;
        padding: 12px 21px;
        font-size: 20px;
        font-weight: 700;
        transform: rotate(7deg);
      }
      .sub {
        font-size: 24px;
        margin-top: 44px;
        letter-spacing: -0.4px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">
        <img src="../website/assets/focustube-icon.svg" alt="" />FocusTube
      </div>
      <div class="free">Free. Open source.</div>
      <h1>Keep the video.<br />Lose the distractions.</h1>
      <svg class="underline" viewBox="0 0 724 22" fill="none">
        <path
          d="M6 15 Q340 -3 716 9 M72 21 Q380 7 674 17"
          stroke="#f9f493"
          stroke-width="5"
          stroke-linecap="round"
        />
      </svg>
      <p class="sub">Hide comments, recommendations, and Shorts.</p>
      <div class="bottom">
        <div class="detail">
          <img src="../website/assets/chrome.svg" alt="" />Your YouTube, with
          room to focus.
        </div>
        <span class="by">Made by Animesh Sharma</span>
      </div>
    </div>
  </body>
</html>
